name: Build distribution packages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Validate committed packages and skill frontmatter
        run: |
          python scripts/distribution.py check --official-schemas
          python -m unittest discover -s tests -v
      - name: Rebuild and verify reproducibility
        run: |
          python scripts/distribution.py build --official-schemas --output-dir "$RUNNER_TEMP/packages"
          diff -r dist "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-packages-${{ github.sha }}
          path: dist/archives/
          if-no-files-found: error
          retention-days: 7
