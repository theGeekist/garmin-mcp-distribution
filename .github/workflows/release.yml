name: Publish distribution release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - name: Build and validate packages
        run: |
          python scripts/distribution.py check --official-schemas
          python -m unittest discover -s tests -v
          python scripts/distribution.py build --official-schemas --output-dir "$RUNNER_TEMP/packages"
          diff -r dist "$RUNNER_TEMP/packages"
      - name: Publish verified distribution assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("catalogue/garmin.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          assets=(
            "dist/archives/garmin-mcp-$VERSION-openai.zip"
            "dist/archives/garmin-mcp-$VERSION-codex-marketplace.zip"
            "dist/archives/garmin-mcp-$VERSION-claude-plugin.zip"
            "dist/archives/garmin-mcp-$VERSION-claude-code.zip"
            "dist/archives/garmin-mcp-$VERSION-gemini-cli.zip"
            "dist/archives/SHA256SUMS"
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          python scripts/release_notes.py CHANGELOG.md "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          result=$(python scripts/verify_release_assets.py "$RUNNER_TEMP/releases.json" "$GITHUB_REF_NAME" "${assets[@]}")
          if [ "$result" = absent ]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "Garmin MCP by geekist.co $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
            test "$(python scripts/verify_release_assets.py "$RUNNER_TEMP/releases.json" "$GITHUB_REF_NAME" "${assets[@]}")" = match
          else
            test "$result" = match
            echo 'Existing published release assets match the verified build.'
          fi
