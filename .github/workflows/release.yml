name: Publish Gemini CLI release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - name: Build and validate packages
        run: |
          python scripts/distribution.py check --official-schemas
          python -m unittest discover -s tests -v
          python scripts/distribution.py build --official-schemas --output-dir "$RUNNER_TEMP/packages"
          diff -r dist "$RUNNER_TEMP/packages"
      - name: Publish versioned Gemini archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("catalogue/garmin.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          ASSET="garmin-mcp-$VERSION-gemini-cli.zip"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          RESULT=$(python -c '
          import hashlib, json, pathlib, sys
          pages = json.loads(pathlib.Path(sys.argv[1]).read_text())
          tag, asset = sys.argv[2], pathlib.Path(sys.argv[3])
          releases = [r for page in pages for r in page if r["tag_name"] == tag]
          if not releases:
              print("absent")
              sys.exit(0)
          if len(releases) != 1 or releases[0]["draft"]:
              sys.exit("Expected one published release for the tag")
          matches = [a for a in releases[0]["assets"] if a["name"] == asset.name]
          if len(matches) != 1:
              sys.exit("Expected one asset on the published release")
          expected = "sha256:" + hashlib.sha256(asset.read_bytes()).hexdigest()
          if matches[0].get("digest") != expected:
              sys.exit("Published asset digest is missing or does not match")
          print("match")
          ' "$RUNNER_TEMP/releases.json" "$GITHUB_REF_NAME" "dist/archives/$ASSET")
          if [ "$RESULT" = "absent" ]; then
            gh release create "$GITHUB_REF_NAME" "dist/archives/$ASSET" --verify-tag --title "Garmin MCP by geekist.co $VERSION" --generate-notes
          else
            test "$RESULT" = "match"
            echo "Existing published release asset digest matches the verified build."
          fi
