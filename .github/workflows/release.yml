name: Publish Gemini CLI release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - name: Build and validate packages
        run: |
          python scripts/distribution.py check --official-schemas
          python -m unittest discover -s tests -v
          python scripts/distribution.py build --official-schemas --output-dir "$RUNNER_TEMP/packages"
          diff -r dist "$RUNNER_TEMP/packages"
      - name: Publish versioned Gemini archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("catalogue/garmin.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          ASSET="garmin-mcp-$VERSION-gemini-cli.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "false"
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download "$GITHUB_REF_NAME" --pattern "$ASSET" --dir "$RUNNER_TEMP/existing-release"
            cmp "dist/archives/$ASSET" "$RUNNER_TEMP/existing-release/$ASSET"
            echo "Existing published release asset matches the verified build."
          else
            gh release create "$GITHUB_REF_NAME" "dist/archives/$ASSET" --verify-tag --title "Garmin MCP by geekist.co $VERSION" --generate-notes
          fi
