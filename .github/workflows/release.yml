name: Publish Gemini CLI release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - name: Build and validate packages
        run: |
          python scripts/distribution.py check --official-schemas
          python -m unittest discover -s tests -v
          python scripts/distribution.py build --official-schemas --output-dir "$RUNNER_TEMP/packages"
          diff -r dist "$RUNNER_TEMP/packages"
      - name: Publish versioned Gemini archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("catalogue/garmin.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          ASSET="garmin-mcp-$VERSION-gemini-cli.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/release.json"
            python -c '
          import hashlib, json, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          asset = pathlib.Path(sys.argv[2])
          matches = [a for a in release["assets"] if a["name"] == asset.name]
          if release["draft"] or len(matches) != 1:
              sys.exit("Expected one asset on a published release")
          expected = "sha256:" + hashlib.sha256(asset.read_bytes()).hexdigest()
          if matches[0].get("digest") != expected:
              sys.exit("Published asset digest is missing or does not match")
          ' "$RUNNER_TEMP/release.json" "dist/archives/$ASSET"
            echo "Existing published release asset digest matches the verified build."
          else
            gh release create "$GITHUB_REF_NAME" "dist/archives/$ASSET" --verify-tag --title "Garmin MCP by geekist.co $VERSION" --generate-notes
          fi
