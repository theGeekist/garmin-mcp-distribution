name: Build from public baseline
on:
  push:
    branches: [main]
    paths:
      - 'baselines/**/*.zip'
  workflow_dispatch:
    inputs:
      revision:
        description: Public commit containing the baseline
        required: true
        type: string
      version:
        description: Baseline version
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the reviewed baseline
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: public-distribution-update
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select and validate public baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_REVISION: ${{ inputs.revision }}
          REQUEST_VERSION: ${{ inputs.version }}
          REQUEST_SHA: ${{ inputs.sha256 }}
          HEAD_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, re, subprocess
          version_pattern = r'(?:0|[1-9]\d*)(?:\.(?:0|[1-9]\d*)){2}'
          if os.environ['EVENT_NAME'] == 'push':
              names = subprocess.check_output(['git', 'diff-tree', '--no-commit-id', '--name-only', '--diff-filter=AM', '-r', 'HEAD'], text=True).splitlines()
              matches = [(m.group(1), name) for name in names if (m := re.fullmatch(r'baselines/(' + version_pattern + r')/garmin-mcp-\1-public-baseline\.zip', name))]
              if len(matches) != 1:
                  raise SystemExit('Expected exactly one added or modified versioned baseline')
              version, path = matches[0]
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              revision = os.environ['HEAD_REVISION']
          else:
              version, revision, digest = (os.environ[x] for x in ('REQUEST_VERSION', 'REQUEST_REVISION', 'REQUEST_SHA'))
          if not re.fullmatch(version_pattern, version) or not re.fullmatch(r'[0-9a-f]{40}', revision) or not re.fullmatch(r'[0-9a-f]{64}', digest):
              raise SystemExit('Invalid version, commit or digest')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'BASELINE_VERSION={version}\nBASELINE_REVISION={revision}\nBASELINE_SHA={digest}\n')
          PY
      - name: Download the published baseline
        run: |
          url="https://raw.githubusercontent.com/theGeekist/garmin-mcp-distribution/${BASELINE_REVISION}/baselines/${BASELINE_VERSION}/garmin-mcp-${BASELINE_VERSION}-public-baseline.zip"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --max-filesize 1048576 "$url" -o "$RUNNER_TEMP/baseline.zip"
          python scripts/sync_public_baseline.py --baseline "$RUNNER_TEMP/baseline.zip" --sha256 "$BASELINE_SHA"
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/distribution.py build --official-schemas --output-dir "$RUNNER_TEMP/packages"
      - name: Commit generated distribution and dispatch versioned releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Public main changed; retry this workflow.'; exit 1; }
          rm -rf dist
          cp -a "$RUNNER_TEMP/packages" dist
          python scripts/distribution.py check --official-schemas
          python scripts/release_notes.py CHANGELOG.md "$BASELINE_VERSION" > /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue/garmin.json server.json CHANGELOG.md skills/garmin-review providers/gemini/GEMINI.md upstream README.md docs/clients/README.md dist
          if ! git diff --cached --quiet; then
            git commit -m "Build public Garmin distribution $BASELINE_VERSION"
            git push origin HEAD:main
          fi
          tag="v$BASELINE_VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            for file in server.json "dist/archives/garmin-mcp-${BASELINE_VERSION}-openai.zip" "dist/archives/garmin-mcp-${BASELINE_VERSION}-codex-marketplace.zip" "dist/archives/garmin-mcp-${BASELINE_VERSION}-claude-plugin.zip" "dist/archives/garmin-mcp-${BASELINE_VERSION}-claude-code.zip" "dist/archives/garmin-mcp-${BASELINE_VERSION}-gemini-cli.zip" dist/archives/SHA256SUMS; do
              test "$(git show "$tag:$file" | sha256sum | cut -d ' ' -f 1)" = "$(sha256sum "$file" | cut -d ' ' -f 1)" || { echo "Existing tag differs: $file"; exit 1; }
            done
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          gh workflow run release.yml --ref "$tag"
          gh workflow run publish-mcp.yml --ref "$tag"
      - name: Verify published release and registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$BASELINE_VERSION"
          assets=("dist/archives/garmin-mcp-$version-openai.zip" "dist/archives/garmin-mcp-$version-codex-marketplace.zip" "dist/archives/garmin-mcp-$version-claude-plugin.zip" "dist/archives/garmin-mcp-$version-claude-code.zip" "dist/archives/garmin-mcp-$version-gemini-cli.zip" dist/archives/SHA256SUMS)
          for attempt in {1..30}; do
            release_ok=false
            registry_ok=false
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" > "$RUNNER_TEMP/release.json" 2>/dev/null; then
              python - "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release-list.json" <<'PYRELEASE'
          import json, pathlib, sys
          pathlib.Path(sys.argv[2]).write_text(json.dumps([[json.loads(pathlib.Path(sys.argv[1]).read_text())]]))
          PYRELEASE
              if python scripts/verify_release_assets.py "$RUNNER_TEMP/release-list.json" "v$version" "${assets[@]}" | grep -qx match; then release_ok=true; fi
            fi
            if curl --fail --silent --show-error "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.theGeekist%2Fgarmin-mcp/versions/$version" -o "$RUNNER_TEMP/registry.json" 2>/dev/null && python - "$RUNNER_TEMP/registry.json" <<'PYREGISTRY'
          import json, pathlib, sys
          actual=json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected=json.loads(pathlib.Path('server.json').read_text())
          if actual.get('server') != expected or actual.get('_meta',{}).get('io.modelcontextprotocol.registry/official',{}).get('status') != 'active':
              raise SystemExit(1)
          PYREGISTRY
            then registry_ok=true; fi
            if [ "$release_ok" = true ] && [ "$registry_ok" = true ]; then
              echo 'All release assets and the MCP Registry entry are verified.'
              exit 0
            fi
            sleep 10
          done
          echo 'Release or registry publication did not verify within five minutes.' >&2
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-public-distribution
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-public-inputs
          path: |
            catalogue/garmin.json
            skills/garmin-review/
            providers/gemini/GEMINI.md
            upstream/
            README.md
            docs/clients/README.md
          if-no-files-found: error
